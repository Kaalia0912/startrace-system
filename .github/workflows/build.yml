name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: mvn -B test -pl ruoyi-system -am -DskipTests=false

      - name: Package backend jar
        run: mvn -B package -DskipTests

      - name: Upload backend jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ruoyi-admin/target/ruoyi-admin.jar

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ruoyi-ui
        run: npm ci

      - name: Build frontend
        working-directory: ruoyi-ui
        run: npm run build:prod

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-ui-dist
          path: ruoyi-ui/dist
